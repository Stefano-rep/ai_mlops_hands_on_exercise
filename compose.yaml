services:
  backend:
    volumes:
      - type: bind
        source: ./datasets/census_income_cleaned.csv
        target: /app/datasets/census_income_cleaned.csv
        read_only: true
        bind:
          create_host_path: false
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
