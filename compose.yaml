services:
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: ai/agent/Dockerfile
    stdin_open: true
    tty: true
    environment:
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-fake-key-replace-me}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ML_MODEL_PATH: /app/artifacts/mlp_pipeline.joblib
    volumes:
      - type: bind
        source: ./artifacts/mlp_pipeline.joblib
        target: /app/artifacts/mlp_pipeline.joblib
        read_only: true
        bind:
          create_host_path: false

  backend:
    volumes:
      - type: bind
        source: ./datasets/census_income_cleaned.csv
        target: /app/datasets/census_income_cleaned.csv
        read_only: true
        bind:
          create_host_path: false
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
