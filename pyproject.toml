[project]
name = "ai_exercise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
backend = [
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
