[project]
name = "ai_exercise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "threadpoolctl>=3.8.0",
]

[dependency-groups]
agent = [
    "joblib>=1.6.0",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "threadpoolctl>=3.8.0",
]
backend = [
    "fastapi>=0.162.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
